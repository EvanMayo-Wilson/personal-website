<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Evan Mayo-Wilson</title>
<meta name="robots" content="noindex">
<script>
  // Honour the site's light/dark toggle (same localStorage key as the main page).
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="../vendor/pdfjs-dist-4.10.38/pdf_viewer.css">
<style>
  :root { --navy:#13294b; --bg:#ffffff; --surface:#f4f6f9; --text:#23282f; --link:#14568c; --rule:#e2e6eb;
          --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d1521; --surface:#172232; --text:#e7ecf2; --link:#7cbdea; --rule:#26334a; }
  }
  :root[data-theme="dark"] { --bg:#0d1521; --surface:#172232; --text:#e7ecf2; --link:#7cbdea; --rule:#26334a; }
  html, body { margin:0; height:100%; background:var(--surface); color:var(--text); font-family:var(--sans); }
  header { position:fixed; top:0; left:0; right:0; height:48px; display:flex; align-items:center; gap:1rem;
           padding:0 16px; background:var(--bg); border-bottom:1px solid var(--rule); z-index:10; font-size:15px; }
  header .title { font-weight:600; margin-right:auto; }
  header a, header button { color:var(--link); text-decoration:none; background:none; border:0; font:inherit; cursor:pointer; padding:4px; }
  header a:hover, header button:hover { text-decoration:underline; }
  #viewerContainer { position:absolute; top:49px; left:0; right:0; bottom:0; overflow:auto; }
  .pdfViewer .page { box-shadow:0 1px 4px rgba(0,0,0,.18); }
  #status { padding:2rem 16px; }
</style>
</head>
<body>
<header>
  <a class="title" href="../">Evan Mayo-Wilson</a>
  <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
  <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
  <a href="../cv.pdf?v=bd9892f2a6" download="Mayo-Wilson_CV.pdf">Download PDF</a>
</header>
<div id="viewerContainer" tabindex="0" role="region" aria-label="CV">
  <div id="viewer" class="pdfViewer"></div>
  <p id="status" role="status" aria-live="polite">Loading CV… If it does not appear, <a href="../cv.pdf?v=bd9892f2a6">open the PDF</a>.</p>
</div>
<script type="module">
  // Self-hosted PDF.js viewer (pdfjs-dist 4.10.38, Apache-2.0; see ../vendor/pdfjs-dist-4.10.38/LICENSE).
  // Every link inside the CV opens in a new tab (Evan, 2026-11-11).
  const VENDOR = "../vendor/pdfjs-dist-4.10.38/";
  const pdfjsLib = await import(VENDOR + "pdf.min.mjs");
  globalThis.pdfjsLib = pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = VENDOR + "pdf.worker.min.mjs";
  const { EventBus, PDFLinkService, PDFViewer, LinkTarget } = await import(VENDOR + "pdf_viewer.mjs");
  const container = document.getElementById("viewerContainer");
  const eventBus = new EventBus();
  const linkService = new PDFLinkService({ eventBus, externalLinkTarget: LinkTarget.BLANK, externalLinkRel: "noopener noreferrer" });
  const viewer = new PDFViewer({ container, eventBus, linkService, textLayerMode: 1 });
  linkService.setViewer(viewer);
  eventBus.on("pagesinit", () => { viewer.currentScaleValue = window.innerWidth < 700 ? "page-width" : "auto"; });
  try {
    const doc = await pdfjsLib.getDocument({ url: "../cv.pdf?v=bd9892f2a6" }).promise;
    document.getElementById("status").remove();
    viewer.setDocument(doc); linkService.setDocument(doc, null);
  } catch (e) {
    document.getElementById("status").textContent = "The CV could not be displayed here. ";
    const a = document.createElement("a"); a.href = "../cv.pdf?v=bd9892f2a6"; a.textContent = "Open the PDF";
    document.getElementById("status").append(a);
  }
  const step = f => { viewer.currentScale = Math.min(4, Math.max(0.4, viewer.currentScale * f)); };
  document.getElementById("zoomIn").onclick = () => step(1.15);
  document.getElementById("zoomOut").onclick = () => step(1 / 1.15);
  window.addEventListener("resize", () => { if (["auto", "page-width"].includes(viewer.currentScaleValue)) viewer.currentScaleValue = viewer.currentScaleValue; });
</script>
</body>
</html>
