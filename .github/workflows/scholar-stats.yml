name: Update Google Scholar stats

# Refreshes docs/scholar-stats.json from your Google Scholar profile via
# generate_scholar_stats.py (one plain page fetch, no third-party scraper).
# Runs daily and can be triggered by hand.
#
# NOTE: Google Scholar has no API and sometimes blocks GitHub's runners with a
# CAPTCHA. When that happens the job fails within seconds and the last good
# numbers stay on the site; the next day's run tries again.

on:
  schedule:
    - cron: "40 6 * * *"     # daily, 06:40 UTC (offset from pub-stats.yml)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write             # allows the job to commit the updated JSON

jobs:
  scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation stats
        run: python3 generate_scholar_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/scholar-stats.json
          git diff --cached --quiet || git commit -m "Update Google Scholar stats"
          git push
