name: Update Google Scholar stats

# Manual-only fallback for refreshing docs/scholar-stats.json via
# generate_scholar_stats.py. Not scheduled: Google Scholar blocks GitHub's
# runners (HTTP 403 / CAPTCHA), so the daily refresh runs instead from a
# launchd job on Evan's Mac Mini (`generate_scholar_stats.py --push`).
# If a manual run is blocked it fails within seconds and changes nothing.

on:
  workflow_dispatch: {}       # run by hand from the Actions tab

permissions:
  contents: write             # allows the job to commit the updated JSON

jobs:
  scholar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation stats
        run: python3 generate_scholar_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/scholar-stats.json
          git diff --cached --quiet || git commit -m "Update Google Scholar stats"
          git push
